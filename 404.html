<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F4ECD8;
      color: #2D2B2A;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 1.25rem;
      line-height: 1.8;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    main {
      max-width: 680px;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #E2DDD3;
    }
    .logo {
      font-family: 'Libre Baskerville', serif;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      color: #2D2B2A;
    }
    nav a {
      color: #6A655C;
      text-decoration: none;
      font-size: 1.1rem;
      margin-left: 1.2rem;
    }
    .error-container {
      margin: 4rem 0;
      text-align: left;
    }
    .error-code {
      font-family: 'Libre Baskerville', serif;
      font-size: 4rem;
      color: #8A857B;
      font-weight: normal;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: 'Libre Baskerville', serif;
      font-size: 1.8rem;
      margin-bottom: 1rem;
      font-weight: normal;
    }
    p {
      margin-bottom: 2rem;
      color: #4A463D;
    }
    .home-link {
      display: inline-block;
      color: #2D2B2A;
      font-family: 'Libre Baskerville', serif;
      font-size: 1rem;
      text-decoration: none;
      border-bottom: 1px solid #2D2B2A;
      padding-bottom: 2px;
    }
    .home-link:hover {
      color: #6A655C;
      border-color: #6A655C;
    }
    footer {
      margin-top: 5rem;
      text-align: center;
      font-size: 0.95rem;
      color: #6A655C;
    }
  </style>
</head>
<body>

<main>
  <div>
    <header>
      <a href="index.html" class="logo">Journal</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="reading-list.html">Reading List</a>
      </nav>
    </header>

    <article class="error-container">
      <div class="error-code">404</div>
      <h1>Page Not Found</h1>
      <p>The page or entry you are looking for does not exist, has moved, or was removed.</p>
      <a href="index.html" class="home-link">← Return to Home</a>
    </article>
  </div>

  <footer>
    © 2026 — Personal Journal
  </footer>
</main>

</body>
</html>
