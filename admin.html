<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font Preconnects (Add here) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

 <!-- Primary Search Engine SEO (Keep private administrative utility hidden from search) -->
<title>Admin — Log Book</title>
<meta name="robots" content="noindex, nofollow">
  
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/app.js" defer></script>
</head>
<body>

  <!-- Book Cover Loading Overlay -->
  <div id="book-loader">
    <div class="book-cover">
      <div class="cover-front">
        <span class="cover-title">Journal</span>
      </div>
      <div class="cover-inside"></div>
    </div>
  </div>

  <div class="container">
    <header>
      <a href="index.html" class="site-title">Journal Admin</a>
      <nav>
        <a href="reading-list.html">View Reading List →</a>
      </nav>
    </header>

    <main>
      <article>
        <h1>Log a New Book</h1>
        <p class="subtitle" style="font-style: italic; color: #7a756b; margin-bottom: 2.5rem;">Private editor entry for adding books to Supabase.</p>

        <form id="bookForm" class="guestbook-form">
          <input type="text" id="bookTitle" placeholder="Book Title" required class="guestbook-input">
          <input type="text" id="bookAuthor" placeholder="Author Name" required class="guestbook-input">
          <textarea id="bookNotes" rows="4" placeholder="Your thoughts, takeaways, or review..." class="guestbook-textarea"></textarea>
          <button type="submit" class="guestbook-btn">Save to Reading List</button>
        </form>
        <p id="statusMessage" style="margin-top: 1rem; font-size: 1rem; color: #6a655c;"></p>
      </article>
    </main>

    <footer>
      <p>© 2026 — Personal Journal</p>
    </footer>
  </div>

</body>
</html>
